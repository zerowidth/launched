# https://fly.io/docs/reference/configuration/
app = "launched"
primary_region = "dfw"

[build]
  [build.args]
    GO_VERSION = '1.26.5'
    LITESTREAM_VERSION = '0.5.0'

[processes]
  server = "launched --listen-address 0.0.0.0:8080 --db-path /data/launched.db"

[env]
  PORT = "8080"
  LAUNCHED_BASE_URL = "https://launched.zerowidth.com"

[http_service]
  processes = ["server"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  max_machines_running = 1

[[mounts]]
  source = "launched_data"
  destination = "/data"
  processes = ["server"]
